# 基金估值项目配置

# 数据源 URL 配置
data_sources:
  urls:
    # 中证指数-沪深300
    csindex_origin: "https://www.csindex.com.cn/csindex-home/perf/index-perf?indexCode={000300}}"
    # fund123，蚂蚁基金
    fund123_origin: "https://www.fund123.cn"
    fund123_fund_page: "https://www.fund123.cn/fund"
    fund123_search_api: "https://www.fund123.cn/api/fund/searchFund"
    # 基金详情
    fund123_matiaria_tpl: "https://www.fund123.cn/matiaria?fundCode={fund}"
    # 业绩曲线，dateInterval可以取：ONE_MONTEH、THREE_MONTH、SIX_MONTH、ONE_YEAR、THREE_YEAR、ALL
    fund123_curves_api: "https://www.fund123.cn/api/fund/queryFundQuotationCurves"
    # 估值曲线
    fund123_intraday_api: "https://www.fund123.cn/api/fund/queryFundEstimateIntraday"
    # 历史净值（可指定起止日期查询）
    fund123_history_net_value_api: "https://www.fund123.cn/api/fund/queryFundHistoryNetValueList"

    # eastmoney
    eastmoney_fundguide_api: "https://fund.eastmoney.com/data/FundGuideapi.aspx"
    eastmoney_fundguide_referer: "https://fund.eastmoney.com/daogou/"
    eastmoney_bk_api: "https://push2.eastmoney.com/api/qt/clist/get"

    # jijinhao / cngold
    cngold_hist_referer: "https://quote.cngold.org/gjs/swhj_zghj.html"
    cngold_realtime_referer: "https://quote.cngold.org/gjs/gjhj.html"
    jijinhao_history_api: "https://api.jijinhao.com/quoteCenter/history.htm"
    jijinhao_realtime_api: "https://api.jijinhao.com/quoteCenter/realTime.htm"

    # fundgz
    fundgz_js_tpl: "https://fundgz.1234567.com.cn/js/{fund}.js"

# 页面刷新配置
page_refresh:
  # 自动刷新间隔时长（毫秒）
  auto_refresh_interval: 300000  # 5 分钟

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8312
  secret_key: "luobobo"  # Flask session 密钥

# 历史净值同步配置
nav_sync:
  # 单次请求的页大小
  request_page_size: 300
  # 历史补齐的月数窗口（每次请求覆盖的月份跨度）
  backfill_months: 12
  # 当日 20:00 前不请求当天净值（等待当日净值披露）
  include_today_after: "20:00"

# 业绩图表配置
performance_chart:
  # 时间区间标签
  interval_labels:
    ONE_MONTH: "近1月"
    THREE_MONTH: "近3月"
    SIX_MONTH: "近6月"
    ONE_YEAR: "近1年"
    THREE_YEAR: "近3年"
    FIVE_YEAR: "近5年"
    SINCE_ESTABLISHMENT: "成立以来"

  # 时间区间对应的天数
  interval_days:
    ONE_MONTH: 31
    THREE_MONTH: 93
    SIX_MONTH: 186
    ONE_YEAR: 365
    THREE_YEAR: 1095
    FIVE_YEAR: 1825

  # 时间区间显示顺序
  interval_order:
    - ONE_MONTH
    - THREE_MONTH
    - SIX_MONTH
    - ONE_YEAR
    - THREE_YEAR
    - FIVE_YEAR
    - SINCE_ESTABLISHMENT

  # 默认业绩图表时间区间
  default_interval: "SINCE_ESTABLISHMENT"
  # 默认收益图表时间区间
  default_profit_interval: "THREE_MONTH"

logging:
  level: "INFO"
  log_response_time: true
  log_file: "logs/fund_eval.log"

# 日志内容定时清理（仅保留最近一段时间）
logging_cleanup:
  enabled: true
  retain_days: 14
  interval_hours: 24

# HTTP详细请求日志终端输出开关
http_timing:
  console_log: false

update_interval: 300  # 单位：秒
