<!DOCTYPE html>
<html lang="zh-CN" data-app-base="{{ request.script_root }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}MiniFund{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='1.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="top-navbar">
        <div class="top-navbar-brand">
            <img src="{{ url_for('static', filename='1.ico') }}" alt="Logo" class="navbar-logo">
        </div>
        <div class="top-navbar-quote" id="lyricsDisplay">
            偶然与巧合, 舞动了蝶翼, 谁的心头风起 ————《如果我们不曾相遇》
        </div>
        <div class="top-navbar-menu">
            <a href="https://github.com/lanZzV/fund" target="_blank" class="nav-star">点个赞</a>
            <a href="https://github.com/lanZzV/fund/issues" target="_blank" class="nav-feedback">反馈</a>
            {% if username %}
            <span class="nav-user">🍎 {{ username }}</span>
            <form method="POST" action="{{ url_for('auth.logout') }}" class="nav-logout-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="nav-logout">退出登录</button>
            </form>
            {% endif %}
        </div>
    </nav>

    <!-- 主容器 -->
    <div class="main-container">
        <!-- 汉堡菜单按钮 (移动端) -->
        <button class="hamburger-menu" id="hamburgerMenu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- 左侧导航栏 -->
        <div class="sidebar collapsed" id="sidebar">
            <div class="sidebar-toggle" id="sidebarToggle">▶</div>
            <a href="{{ url_for('pages.get_portfolio') }}" class="sidebar-item{% if active_page == 'portfolio' %} active{% endif %}">
                <span class="sidebar-icon">💼</span>
                <span>持仓基金</span>
            </a>
            <a href="{{ url_for('pages.get_sectors') }}" class="sidebar-item{% if active_page == 'sectors' %} active{% endif %}">
                <span class="sidebar-icon">🏢</span>
                <span>行业板块</span>
            </a>
            {% if is_admin %}
            <a href="{{ url_for('pages.get_settings') }}" class="sidebar-item sidebar-settings{% if active_page == 'settings' %} active{% endif %}">
                <span class="sidebar-icon">⚙️</span>
                <span>设置</span>
            </a>
            {% endif %}
        </div>

        <!-- 内容区域 -->
        <div class="content-area">
            {% block content %}{% endblock %}
        </div>
    </div>

    {% block modals %}{% endblock %}

    <script src="{{ url_for('static', filename='js/app-url.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}?v=20260721a"></script>
    <script src="{{ url_for('static', filename='js/sidebar-nav.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
